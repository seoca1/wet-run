name: Wet Run Delegation Verification

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'scripts/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      shard_pattern:
        description: 'Test shard pattern (e.g., tests/edge_cases*.test.ts)'
        required: false
        type: string
      notify_discord:
        description: 'Send Discord notification on completion'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_WET_RUN }}

jobs:
  verify:
    name: Delegation Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      
      - name: TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit
      
      - name: Lint
        working-directory: ./web
        run: npm run lint
      
      - name: Format check
        working-directory: ./web
        run: npm run format -- --check
      
      - name: Run unit tests
        working-directory: ./web
        run: |
          if [ -n "${{ github.event.inputs.shard_pattern }}" ]; then
            npm test -- ${{ github.event.inputs.shard_pattern }}
          else
            npm test
          fi
      
      - name: Balance harness (optional)
        if: ${{ github.event.inputs.shard_pattern == '' }}
        working-directory: ./web
        run: npm run balance -- --runs 100
        continue-on-error: true

  notify:
    name: Discord Notification
    needs: verify
    if: always() && (github.event.inputs.notify_discord != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          RESULT="${{ needs.verify.result }}"
          COLOR="3447003"  # blue
          TITLE="✅ CI Passed"
          DESC="All checks passed for wet-run delegation verification."
          
          if [ "$RESULT" = "failure" ]; then
            COLOR="15158332"  # red
            TITLE="❌ CI Failed"
            DESC="Some checks failed for wet-run delegation verification. Check workflow for details."
          elif [ "$RESULT" = "cancelled" ]; then
            COLOR="15844367"  # orange
            TITLE="⚠️ CI Cancelled"
            DESC="Workflow was cancelled."
          fi
          
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "description": "$DESC",
              "color": $COLOR,
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": { "text": "wet-run CI" },
              "fields": [
                { "name": "Workflow", "value": "${{ github.workflow }}", "inline": true },
                { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                { "name": "Commit", "value": "${{ github.sha::8 }}", "inline": true }
              ]
            }]
          }
          EOF
          )
          
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_WET_RUN }}