name: Deploy Dashboard + Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify dashboard files exist
        run: |
          echo "Dashboard:"
          ls -la dashboard/
          echo ""
          echo "Design (for fetch()):"
          ls -la design/

      - name: Build Wiki (MkDocs Material)
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material[recommended]" pymdown-extensions
          mkdocs build --strict
          echo ""
          echo "Wiki built. Size:"
          du -sh site/
          echo ""
          echo "Wiki pages:"
          find site -name "*.html" | wc -l
          echo "HTML pages"

      - name: Prepare gh-pages artifact
        run: |
          mkdir -p _pages
          # Dashboard: copy entire directory recursively (all HTML/JS/CSS/JSON/assets).
          # Replaces prior file-by-file list which drifted as new pages were added
          # (character-graph, mission-flow, jokey, dungeon, player, play, glossary.json, etc.).
          cp -r dashboard/. _pages/
          # Wiki (MkDocs Material build output) → /wiki/ sub-path
          cp -r site/ _pages/wiki/
          # Sibling assets referenced by dashboard via fetch()
          cp -r design/ _pages/design/
          cp -r Fiction/derivative/ _pages/Fiction/derivative/ 2>/dev/null || true
          # Disable Jekyll processing on GitHub Pages
          touch _pages/.nojekyll
          echo ""
          echo "Artifact contents:"
          find _pages -type f | sort | head -50
          echo ""
          echo "Total files: $(find _pages -type f | wc -l)"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: dashboard + wiki ${{ github.sha }}"

      - name: Enable Pages (gh-pages branch)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            try {
              await github.rest.repos.enablePages({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: { branch: 'gh-pages', path: '/' }
              });
              core.info('Pages enabled on gh-pages branch');
            } catch (e) {
              core.warning('Could not auto-enable Pages (may need manual setup): ' + e.message);
            }
