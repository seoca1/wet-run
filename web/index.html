<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Cyberpunk roguelike game set in the Sprawl" />
    <title>Wet Run — Web MVP</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #000;
        color: #d0d0d0;
        font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
        overflow: hidden;
        height: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game-canvas {
        display: block;
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
        touch-action: none;
      }
      #status-overlay {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #00ff41;
        color: #00ff41;
        font-size: 12px;
        line-height: 1.4;
        z-index: 10;
        max-width: 200px;
        word-wrap: break-word;
      }
      #gamepad-status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #00ff41;
        color: #00ff41;
        font-size: 10px;
        z-index: 10;
        display: none;
      }
      #gamepad-status.connected {
        display: block;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00ff41;
        font-size: 14px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 480px) {
        #status-overlay {
          font-size: 10px;
          padding: 6px 10px;
          top: 4px;
          right: 4px;
        }
        #gamepad-status {
          font-size: 8px;
          bottom: 4px;
          left: 4px;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        #status-overlay {
          font-size: 10px;
          padding: 4px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div role="application" aria-label="Wet Run Game">
      <canvas id="game-canvas" width="640" height="400" role="img" aria-label="Game canvas"></canvas>
      <div id="status-overlay" aria-live="polite"></div>
      <div id="gamepad-status" aria-live="polite"></div>
      <div id="loading">Loading Wet Run...</div>
      <div id="aria-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <div id="aria-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
