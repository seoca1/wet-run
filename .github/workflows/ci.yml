name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      - name: Lint
        working-directory: ./web
        run: npm run lint
      - name: TypeScript check
        working-directory: ./web
        run: npx tsc --noEmit
      - name: Test
        working-directory: ./web
        run: npm test
      - name: Build
        working-directory: ./web
        run: npm run build
      - name: Guard: no build artifacts staged
        working-directory: .
        run: |
          set -euo pipefail
          BLOCKED="dist build site"
          staged=$(git diff --cached --name-only --diff-filter=ACM 2>/dev/null || true)
          violations=()
          for f in $staged; do
            for d in $BLOCKED; do
              [[ "$f" == "$d"/* || "$f" == "$d" ]] && violations+=("$f")
            done
            [[ "$f" == *.map ]] && violations+=("$f")
          done
          if [[ ${#violations[@]} -gt 0 ]]; then
            echo "❌ Build artifacts staged — refusing:" >&2
            printf '   %s\n' "${violations[@]}" >&2
            exit 1
          fi
          echo "✅ No build artifacts staged"

  e2e:
    name: E2E browser tests
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      - name: Install Playwright chromium
        working-directory: ./web
        run: npx playwright install chromium
      - name: Build production bundle
        working-directory: ./web
        run: npm run build
      - name: Serve preview + run E2E
        working-directory: ./web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5199
        run: |
          (npm run preview -- --port 5199 --host 127.0.0.1 &>/tmp/preview.log & echo $! > /tmp/preview.pid)
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5199/ && break
            sleep 2
          done
          npx playwright test --reporter=line
          kill "$(cat /tmp/preview.pid)" || true

  ci-success:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [web, e2e]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"