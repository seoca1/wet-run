[project]
name = "wet-run"
version = "1.1.0a1"
description = "Wet Run — a cyberpunk roguelike set in William Gibson's Sprawl trilogy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Emilio" },
]
keywords = ["roguelike", "cyberpunk", "gibson", "cyberspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "tcod>=16.0",
    "pyyaml",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "interrogate>=1.7",
    "requests>=2.28",  # minimax_music.py (optional BGM tooling)
] 

[project.scripts]
wet-run = "wet_run.engine.app:main"
wr = "wet_run.engine.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wet_run"]
exclude = [
    "data/sounds_test/*.wav",  # Absolute symlinks (BGM v3, 2026-07-11) — wheel invalid
    "data/sounds_test/*",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "data/sounds_test/*.wav",
    "data/sounds_test/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "A"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wet_run"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
enable_error_code = ["possibly-undefined", "explicit-override"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/wet_run"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 30
# Goal: 80%+ coverage. Currently ~38% (data-driven modules are untested in unit tests).
# Tracked in Issue: "increase unit test coverage"
